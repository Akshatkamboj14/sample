name: AI-Powered Code Reviewer

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  run-code-review:
    # Use a GitHub-hosted runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for diffing

      - name: Get the pull request diff
        id: get_diff
        run: |
          # The base commit for the pull request
          BASE_COMMIT=$(git rev-parse HEAD~1)
          # The diff between the current branch and the base commit
          DIFF=$(git diff $BASE_COMMIT HEAD)
          # Output the diff to be used in a later step
          echo "DIFF<<EOF" >> $GITHUB_ENV
          echo "$DIFF" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send diff to Code Review API
        id: send_review
        env:
          # Use your NodePort service's URL
          API_URL: http://44.201.184.34:30798/review
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DIFF: ${{ env.DIFF }}
        run: |
          # Use curl to send a POST request to your deployed service
          # The service will handle the Bedrock API call and post the comment
          curl -X POST "$API_URL" \
          -H "Content-Type: application/json" \
          -d "{ \"repository\": \"$REPO\", \"pull_request_number\": $PR_NUMBER, \"diff\": \"$DIFF\" }"


