name: AI-Powered Code Reviewer

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  run-code-review:
    # Use a GitHub-hosted runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for diffing

      - name: Get the pull request diff
        id: get_diff
        run: |
          # Get the full diff
          DIFF=$(git diff --unified=0 ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          # Escape newlines for shell compatibility
          ESCAPED_DIFF=$(echo "$DIFF" | sed 's/\n/\\n/g')
          # Create JSON payload with the escaped diff
          JSON_PAYLOAD="{\"repository\":\"${{ github.repository }}\",\"pull_request_number\":${{ github.event.pull_request.number }},\"diff\":\"$ESCAPED_DIFF\"}"
          # Pass the payload as an environment variable
          echo "JSON_PAYLOAD=$JSON_PAYLOAD" >> $GITHUB_ENV

      - name: Send diff to Code Review API
        id: send_review
        env:
          # Use your NodePort service's URL
          API_URL: http://44.201.184.34:30798/review
          JSON_PAYLOAD: ${{ env.JSON_PAYLOAD }}
          
        run: |
          # Use curl to send a POST request to your deployed service
          # The service will handle the Bedrock API call and post the comment
          curl -X POST "$API_URL" \
          -H "Content-Type: application/json" \
          -d "$JSON_PAYLOAD"
